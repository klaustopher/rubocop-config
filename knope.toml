[package]
versioned_files = [
    { path = "lib/rubocop/klaustopher/version.rb", regex = 'VERSION = "(?<version>\d+\.\d+\.\d+)"' },
]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "bundle lock"

[[workflows.steps]]
type = "Command"
command = "bundle lock --gemfile sample/Gemfile"

[[workflows.steps]]
type = "Command"
command = "git add Gemfile.lock sample/Gemfile.lock"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "Merging this PR tags and releases $version.\n\n$changelog"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[github]
owner = "klaustopher"
repo = "rubocop-config"
