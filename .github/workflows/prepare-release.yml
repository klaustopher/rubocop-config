name: Prepare release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: true

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.7.0
        with:
          fetch-depth: 0

      - name: Check for pending changesets
        id: changesets
        run: |
          if compgen -G ".changeset/*.md" > /dev/null; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby
        if: steps.changesets.outputs.pending == 'true'
        uses: ruby/setup-ruby@v1.341.0

      - uses: knope-dev/action@v2.1.2
        if: steps.changesets.outputs.pending == 'true'
        with:
          version: 0.24.0

      - name: Create or update release PR
        if: steps.changesets.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          knope prepare-release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
