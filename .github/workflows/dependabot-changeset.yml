name: Dependabot changeset

on: pull_request_target

permissions:
  contents: write
  pull-requests: read

jobs:
  changeset:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3.1.0
        id: metadata

      - name: Check if the update affects the released gem
        id: relevant
        if: steps.metadata.outputs.package-ecosystem == 'bundler' && steps.metadata.outputs.directory == '/'
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          if tr ',' '\n' <<< "$DEPENDENCIES" | grep -qE '^\s*rubocop'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.relevant.outputs.relevant == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Commit changeset
        if: steps.relevant.outputs.relevant == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          file=".changeset/dependabot-${PR_NUMBER}.md"
          if [ -f "$file" ]; then
            echo "$file already exists"
            exit 0
          fi

          case "$UPDATE_TYPE" in
            version-update:semver-major) level=major ;;
            version-update:semver-minor) level=minor ;;
            *) level=patch ;;
          esac

          mkdir -p .changeset
          printf -- '---\ndefault: %s\n---\n\n# %s\n' "$level" "$PR_TITLE" > "$file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "Add changeset for #${PR_NUMBER}"
          git push
